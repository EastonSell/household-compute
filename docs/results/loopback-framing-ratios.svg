<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Complete delivery-and-ACK latency: candidate / baseline</title>
  <desc id="description">Four synthetic payload cases, two runs on one host. activation_decode, run-001: 0.611762; activation_prefill_16, run-001: 0.336393; activation_prefill_64, run-001: 0.267633; audit_reply, run-001: 0.255694; activation_decode, run-002: 0.534605; activation_prefill_16, run-002: 0.307109; activation_prefill_64, run-002: 0.274522; audit_reply, run-002: 0.263573. Each point is the median of ten paired batch-mean ratios. Lower is better; 1 means equal latency. No uncertainty intervals are shown.</desc>
  <rect width="1000" height="650" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#17202b">
    <text x="30" y="44" font-size="26" font-weight="700">Less time for this loopback exchange</text>
    <text x="30" y="76" font-size="17">Complete delivery-and-ACK latency, not throughput or model performance</text>
    <circle cx="40" cy="115" r="6" fill="#0072b2"/>
    <text x="56" y="121" font-size="16">run-001</text>
    <rect x="172" y="109" width="12" height="12" fill="#b95106"/>
    <text x="194" y="121" font-size="16">run-002</text>
    <text x="920" y="121" font-size="15" text-anchor="end">Same host; runs are not independent hosts</text>
    <line x1="320.000" y1="165" x2="320.000" y2="520" stroke="#e1e5e9"/>
    <text x="320.000" y="546" font-size="16" text-anchor="middle">0</text>
    <line x1="458.889" y1="165" x2="458.889" y2="520" stroke="#e1e5e9"/>
    <text x="458.889" y="546" font-size="16" text-anchor="middle">0.25</text>
    <line x1="597.778" y1="165" x2="597.778" y2="520" stroke="#e1e5e9"/>
    <text x="597.778" y="546" font-size="16" text-anchor="middle">0.5</text>
    <line x1="736.667" y1="165" x2="736.667" y2="520" stroke="#e1e5e9"/>
    <text x="736.667" y="546" font-size="16" text-anchor="middle">0.75</text>
    <line id="reference-one" x1="875.556" y1="165" x2="875.556" y2="520" stroke="#69717b" stroke-dasharray="5 5"/>
    <text x="875.556" y="546" font-size="16" text-anchor="middle">1</text>
    <text x="875.556" y="154" font-size="15" text-anchor="middle">Equal latency</text>
    <text x="30" y="202" font-size="17" font-weight="600">activation_decode</text>
    <text x="30" y="226" font-size="15" fill="#53606e">2,368 frame bytes</text>
    <circle data-point="run-001/activation_decode" cx="659.868" cy="194" r="6" fill="#0072b2"/>
    <text x="672.868" y="199" font-size="16">0.611762</text>
    <rect data-point="run-002/activation_decode" x="611.003" y="217" width="12" height="12" fill="#b95106"/>
    <text x="630.003" y="228" font-size="16">0.534605</text>
    <text x="30" y="294" font-size="17" font-weight="600">activation_prefill_16</text>
    <text x="30" y="318" font-size="15" fill="#53606e">36,928 frame bytes</text>
    <circle data-point="run-001/activation_prefill_16" cx="506.885" cy="286" r="6" fill="#0072b2"/>
    <text x="519.885" y="291" font-size="16">0.336393</text>
    <rect data-point="run-002/activation_prefill_16" x="484.616" y="309" width="12" height="12" fill="#b95106"/>
    <text x="503.616" y="320" font-size="16">0.307109</text>
    <text x="30" y="386" font-size="17" font-weight="600">activation_prefill_64</text>
    <text x="30" y="410" font-size="15" fill="#53606e">147,520 frame bytes</text>
    <circle data-point="run-001/activation_prefill_64" cx="468.685" cy="378" r="6" fill="#0072b2"/>
    <text x="481.685" y="383" font-size="16">0.267633</text>
    <rect data-point="run-002/activation_prefill_64" x="466.512" y="401" width="12" height="12" fill="#b95106"/>
    <text x="485.512" y="412" font-size="16">0.274522</text>
    <text x="30" y="478" font-size="17" font-weight="600">audit_reply</text>
    <text x="30" y="502" font-size="15" fill="#53606e">196,676 frame bytes</text>
    <circle data-point="run-001/audit_reply" cx="462.052" cy="470" r="6" fill="#0072b2"/>
    <text x="475.052" y="475" font-size="16">0.255694</text>
    <rect data-point="run-002/audit_reply" x="460.429" y="493" width="12" height="12" fill="#b95106"/>
    <text x="479.429" y="504" font-size="16">0.263573</text>
    <text x="620" y="578" font-size="18" text-anchor="middle">Paired median candidate / baseline latency</text>
    <text x="320" y="607" font-size="15">Lower values favor candidate</text>
    <text x="920" y="607" font-size="15" text-anchor="end">No uncertainty intervals; descriptive medians only</text>
    <text x="30" y="635" font-size="14" fill="#53606e">Source: retained run-001/run-002 result.json and SUMMARY.csv; 10 paired batches per point.</text>
  </g>
</svg>
